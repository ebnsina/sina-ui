name: Report a bug
description: Something in a component or the docs doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Which component or page?
      placeholder: e.g. Date picker, or https://ebnsina.github.io/sinaui/components/date-picker
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, in order, so we can do the same.
      placeholder: |
        1. Open the date picker
        2. Press the right arrow key
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPhone 15, Chrome on Windows 11
    validations:
      required: true
  - type: checkboxes
    id: access
    attributes:
      label: Were you using any of these?
      options:
        - label: A screen reader (which one, in the box below)
        - label: Only the keyboard
        - label: A right-to-left language
        - label: Reduced motion, larger text or high contrast
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A link to a small reproduction, a screenshot or a screen recording helps most.

name: Deploy to GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every page, on every browser and device, must pass axe and fit a 320px screen: one job each, in parallel.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [chrome, android, firefox, safari, iphone, ipad]
    name: test (${{ matrix.project }})
    # Browsers and their system libraries come preinstalled; keep the tag equal to the locked Playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project ${{ matrix.project }}

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          ORIGIN: https://${{ github.repository_owner }}.github.io
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

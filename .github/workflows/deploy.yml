name: Deploy to GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every page, on every browser and device, must pass axe and fit a 320px screen: one job each, in parallel.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { project: chrome, browser: chromium }
          - { project: android, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: safari, browser: webkit }
          - { project: iphone, browser: webkit }
          - { project: ipad, browser: webkit }
    name: test (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project ${{ matrix.project }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          ORIGIN: https://${{ github.repository_owner }}.github.io
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

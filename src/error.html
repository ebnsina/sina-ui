<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Something went wrong — Sina UI</title>
		<!-- Shown only when the site itself can't load: self-contained, no app styles or scripts. -->
		<style>
			:root {
				color-scheme: light dark;
				--fg: light-dark(#0f172a, #f4f4f5);
				--muted: light-dark(#475569, #a3a3a3);
				--accent: light-dark(#047857, #34d399);
				--on-accent: light-dark(#ffffff, #052e22);
				--bg: light-dark(#f4f5f7, #0b0b0c);
				--surface: light-dark(#ffffff, #141414);
			}
			body {
				display: grid;
				place-items: center;
				min-block-size: 100dvh;
				margin: 0;
				padding: 1rem;
				box-sizing: border-box;
				background: var(--bg);
				color: var(--fg);
				font:
					1rem/1.5 'IBM Plex Sans',
					system-ui,
					sans-serif;
			}
			main {
				display: grid;
				justify-items: center;
				gap: 0.75rem;
				max-inline-size: 26rem;
				padding: 2.5rem 2rem;
				border-radius: 1rem;
				background: var(--surface);
				text-align: center;
			}
			.code {
				margin: 0;
				color: var(--accent);
				font:
					500 0.8125rem 'IBM Plex Mono',
					ui-monospace,
					monospace;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
				letter-spacing: -0.02em;
			}
			p {
				margin: 0;
				color: var(--muted);
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.5rem;
				margin-block-start: 0.75rem;
			}
			a {
				display: inline-grid;
				place-items: center;
				min-block-size: 2.5rem;
				padding: 0 1rem;
				border-radius: 0.5rem;
				font-weight: 500;
				text-decoration: none;
			}
			.primary {
				background: var(--accent);
				color: var(--on-accent);
			}
			.secondary {
				background: light-dark(rgb(15 23 42 / 0.06), rgb(255 255 255 / 0.08));
				color: var(--fg);
			}
			a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="code">Error %sveltekit.status%</p>
			<h1>Something went wrong on our side</h1>
			<p>
				It isn't anything you did. Try again in a moment; if it keeps happening, the site is being
				fixed.
			</p>
			<div class="actions">
				<a class="secondary" href="">Try again</a>
				<a class="primary" href="/">Go to the introduction</a>
			</div>
		</main>
	</body>
</html>
